# 强制校验流水线：与 scripts/ci-verify.sh 步骤一致，可在本地复现。
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Compile Debug Kotlin (clean)
        run: ./gradlew clean :app:compileDebugKotlin --no-daemon

      - name: Lint Vital Release
        run: ./gradlew :app:lintVitalRelease --no-daemon

      - name: Navigation and Feature unit tests
        run: |
          ./gradlew \
            :component_nav:testDebugUnitTest \
            :feature_article:testDebugUnitTest \
            :feature_task:testDebugUnitTest \
            :feature_log:testDebugUnitTest \
            --no-daemon --parallel

      - name: Release assemble and observability artifact check
        run: |
          ./gradlew :app:assembleRelease --no-daemon
          bash scripts/verify-release-observability.sh
