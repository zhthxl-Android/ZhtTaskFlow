# =============================================================================
# Android 工程全局属性（无 Hilt / 无 KSP）
# =============================================================================

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.parallel.threads=4
org.gradle.caching=true

android.useAndroidX=true
# 各模块 R 类不随 implementation 传递，减少资源冲突与编译面积（模块化工程推荐保持 true）
android.nonTransitiveRClass=true

kotlin.code.style=official

# 配置缓存：全量 assemble 验证通过后再开启（见 docs/ARCHITECTURE.md § 配置缓存与 Provider.get()）
# org.gradle.configuration-cache=true

feature.task.standalone=false
feature.article.standalone=false
